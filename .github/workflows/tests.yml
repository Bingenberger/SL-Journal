name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # pdftoppm/pdftotext für Vorschau und Textauszug, Tesseract für die OCR
      # eingescannter Anhänge. LibreOffice fehlt bewusst: Es wiegt einige
      # hundert MB; die Office-Umwandlung überspringt ihren Test dann sauber.
      - name: Poppler und Tesseract installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-deu

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q
