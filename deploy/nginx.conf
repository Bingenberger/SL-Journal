# Domain, Zertifikat und VPN-Netz an die tatsächliche Installation anpassen.
# Port 8088 darf ausschließlich lokal erreichbar bleiben.
server {
    listen 443 ssl;
    server_name journal.schule.example;

    ssl_certificate /etc/ssl/journal/fullchain.pem;
    ssl_certificate_key /etc/ssl/journal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Beispiel: nur WireGuard-Netz und localhost. Vor Aktivierung anpassen.
    allow 10.8.0.0/24;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 30m;
    # Suchbegriffe und Dateinamen nicht in Zugriffsprotokolle schreiben.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
