# Variante: nginx läuft auf einem anderen Rechner im VPN/LAN.
#
# Die mitgelieferte journal.service bindet an 127.0.0.1 und vertraut nur sich
# selbst. Beides passt nicht, wenn der Reverse Proxy woanders steht. Diese Datei
# als Drop-in ablegen, statt journal.service zu ändern – dann überschreibt ein
# späteres „git pull“ die Anpassung nicht:
#
#   mkdir -p /etc/systemd/system/journal.service.d
#   cp deploy/journal-remote-proxy.conf /etc/systemd/system/journal.service.d/override.conf
#   systemctl daemon-reload && systemctl restart journal.service
#
# Vor dem Start beide Adressen eintragen:
#   --listen         feste Adresse dieses Rechners, nicht 0.0.0.0
#   --trusted-proxy  Adresse des nginx-Rechners
#
# Ohne passendes --trusted-proxy verwirft waitress die Weiterleitungs-Header.
# Die App sieht dann eine unverschlüsselte Verbindung und antwortet auf jeder
# Seite mit „HTTPS ist erforderlich“ (400). Das ist die übliche Ursache, wenn
# nach der Umstellung nichts mehr geht – nicht nginx.
#
# Auf dem nginx-Rechner muss „proxy_set_header X-Forwarded-Proto https“ gesetzt
# sein und proxy_pass auf diese Adresse zeigen; siehe deploy/nginx.conf.
#
# Port 8088 spricht Klartext-HTTP und kennt keine eigene Zugangskontrolle. Er
# liegt jetzt im Netz statt auf localhost und muss per Firewall auf den
# nginx-Rechner beschränkt werden.

[Service]
# Die leere Zuweisung löscht den geerbten Befehl. Ohne sie hängt systemd den
# neuen nur an und der Dienst startet zweimal.
ExecStart=
ExecStart=/opt/schulleitungsjournal/.venv/bin/waitress-serve \
  --listen=192.168.10.20:8088 --threads=4 \
  --trusted-proxy=192.168.10.5 \
  --trusted-proxy-headers="x-forwarded-for x-forwarded-proto x-forwarded-host" \
  wsgi:app
